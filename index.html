<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cafetería Campus</title>
<style>
  :root{
    --verde: #5f9c6f;
    --verde-oscuro: #4c8a5b;
    --negro: #101010;
    --gris: #b7b7b7;
    --blanco: #ffffff;
  }
 
  *{
    box-sizing: border-box;
  }
 
  body{
    margin: 0;
    font-family: "Segoe UI", Verdana, sans-serif;
    background: var(--verde);
    color: var(--blanco);
  }
 
  /* NAV */
  nav{
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 30px 20px 20px;
  }
 
  nav a{
    color: var(--blanco);
    text-decoration: none;
    font-size: 1.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }
 
  nav a:hover{
    opacity: 0.8;
  }
 
  .divider{
    height: 6px;
    background: var(--negro);
    border: none;
    margin: 0 25px 40px;
  }
 
  /* SECCION INICIO */
  #inicio{
    min-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
  }
 
  #inicio h1{
    font-size: 3rem;
    margin: 0 0 15px;
  }
 
  #inicio p{
    font-size: 1.2rem;
    max-width: 500px;
    opacity: 0.9;
  }
 
  /* SECCION MENU */
  #menu{
    scroll-margin-top: 20px;
    padding: 0 20px 40px;
  }
 
  #menu h2{
    text-align: center;
    font-size: 2.2rem;
    margin-bottom: 40px;
  }
 
  .productos{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px;
  }
 
  .card{
    background: var(--gris);
    border-radius: 6px;
    width: 220px;
    padding: 15px;
    color: var(--negro);
  }
 
  .card img{
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 4px;
    margin-bottom: 15px;
  }
 
  .card h3{
    color: var(--blanco);
    margin: 0 0 5px;
    font-size: 1.4rem;
  }
 
  .card .precio{
    color: var(--blanco);
    font-size: 1.2rem;
    margin: 0 0 15px;
  }
 
  .card button{
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 4px;
    background: var(--negro);
    color: var(--blanco);
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s ease;
  }
 
  .card button:hover{
    background: #2a2a2a;
  }
 
  footer{
    padding: 20px;
  }
 
  @media (max-width: 600px){
    nav{
      flex-direction: column;
      gap: 15px;
    }
    #inicio h1{
      font-size: 2.2rem;
    }
  }
</style>
</head>
<body>
 
  <nav>
<a href="#inicio">Inicio</a>
<a href="#menu">Menu</a>
<a id="linkPedido" href="pedido.html">Pedido</a>
</nav>
<hr class="divider">
 
  <section id="inicio">
<div>
    <h1>Tu café favorito, sin esperar tanto</h1>

    <p>Elige tu producto, indica la cantidad y realiza tu pedido.</p>
</div>
</section>
 

<hr class="divider">

  <section id="menu">
<h2>Nuestro Menu</h2>
<div class="productos">
 
      <div class="card">
<img src="img/cafe.jpg" alt="Cafe">
<h3>Cafe</h3>
<p class="precio">35$</p>
<button onclick="location.href='form.html'">Ordenar</button>
</div>
 
      <div class="card">
<img src="img/te.jpeg" alt="Te">
<h3>Te</h3>
<p class="precio">35$</p>
<button onclick="location.href='form.html'">Ordenar</button>
</div>
 
      <div class="card">
<img src="img/pan.jpg" alt="Pan Dulce">
<h3>Pan  Dulce</h3>
<p class="precio">40$</p>
<button onclick="location.href='form.html'">Ordenar</button>
</div>
 
    </div>
</section>
 
  <hr class="divider">
<footer>
  <center> siguenos en todas nuestras redes sociales :D </center>
</footer>
 
</body>
</html>
